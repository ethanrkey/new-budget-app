name: CI

# Runs on every push and pull request: lint, both typecheckers, every test
# harness (engine, migrations, CVD reference, the phone's wiring and its
# renderer suite), the palette gate, the spelling gate, and a production
# build. The harness (tests/engine.test.mjs) is the project's
# safety net for every migration and money calculation — it MUST live in
# the repo and run here, never only on a developer's machine.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned to the 24 line, never "lts/*" or "latest": the harness
          # imports .ts directly and depends on native type stripping, whose
          # behavior has moved between major versions. A new major must be an
          # explicit, tested change here — not something a runner picks up.
          # Matches package.json "engines" and .nvmrc.
          node-version: "24"
          cache: npm
      - run: npm ci
      # `mobile/` is NOT a workspace — the root install does not touch it,
      # and `npm test` ends by running the phone's renderer suite. Without
      # this step that line fails with "jest: command not found", which is
      # how CI was broken for one commit on 2026-10-08.
      - run: npm ci --prefix mobile
      - run: npm run lint
      - run: npm run typecheck
      # The phone has its own tsconfig and its own strictness; the root
      # typecheck cannot see it.
      - run: npx tsc --noEmit --project mobile
      - run: npm test
      # No Supabase env needed: src/supabase.js reads it at runtime only.
      - run: npm run build
