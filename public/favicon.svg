<svg role="img" aria-label="Key Budget" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- THE ONE DEFINITION OF THE MARK. The web uses this file directly;
       mobile/assets/images/icon.png and the splash mark are all
       generated from it by
       scripts/make_app_icon.mjs, which READS the geometry below rather
       than restating it. Edit the key here and everywhere follows. -->
  <!-- FLAT GOLD, ON PURPOSE. Builds 6 to 8 drew this mark with a
       three-stop metallic gradient and, from build 8, four computed
       fillets in its concave junctions. Both are reverted here to
       build 5's artwork exactly, by the owner's call on 2026-10-15:
       the gradient and the fillets were an attempt to make the shape
       read as struck metal, and the shape is what wants redrawing.
       That redraw is the owner's own future project (PROJECT_SPEC.md
       backlog), so this file holds the drawing it had when it last
       looked right and nothing more.
       There is no defs block any more and the generator no longer
       requires one: it lifts the mark group below and whatever defs
       it finds, if any. (This comment names neither tag literally —
       the generator finds the mark group with a non-greedy regex, so
       an earlier mention of its opening tag up here captures from the
       comment instead, and the guard against a nested group fires.
       That is how this paragraph was written the first time.)
       On iOS this ships as a FLAT PNG, the way build 5 shipped it.
       Builds 6 to 9 shipped a layered Icon Composer bundle instead so
       that iOS 26 would add its own glass; the system re-renders such
       an icon, and the re-render came out of the phone faceted, with
       the ring reading as an octagon. Build 9 proved the geometry was
       innocent — it was this drawing exactly, and still wrong. -->
  <rect width="512" height="512" rx="96" fill="#111827"/>
  <g id="mark">
    <circle cx="176" cy="256" r="74" fill="none" stroke="#eebb4d" stroke-width="50"/>
    <path d="M250 256 H 404" fill="none" stroke="#eebb4d" stroke-width="50" stroke-linecap="round"/>
    <path d="M372 256 V 340" fill="none" stroke="#eebb4d" stroke-width="46" stroke-linecap="round"/>
  </g>
</svg>
